name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The platform-independent core: the gate that runs green everywhere. Builds and unit-tests
  # every library — the self-healing selector engine, the recorder, the recording schema, the
  # cursor overlay/path, and the player driver (jsdom).
  ts-core:
    name: TS core (build + test all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test (selector self-heal, recorder, schema, cursor, player, autozoom, cursoropt)
        run: pnpm -r test
      - name: Smoke-test schema -> TypeScript codegen
        run: pnpm --filter @dolly/schema exec tsx scripts/gen-ts.ts

  # The browser surfaces: the MV3 authoring extension and the embed demo both vite-build into a
  # loadable dist/. The demo also carries the integration test (run in ts-core via pnpm -r test).
  apps:
    name: Apps (extension + demo build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the workspace packages first so the apps resolve their dist/ types.
      - run: pnpm -r --filter "./packages/*" build
      - name: Build the MV3 extension
        run: pnpm --filter @dolly/extension build
      - name: Build the embed demo
        run: pnpm --filter @dolly/demo build
